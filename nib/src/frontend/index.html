<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Nib</title>
<style>
  /* The Welcome window — the app's one fixed window ('main'). Closing it
     hides it (setHideOnClose); it comes back via Window ▸ Welcome, or on its
     own when the last document window closes. */

  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* Appearance: the page resolves View ▸ Appearance itself and stamps a
     concrete data-appearance on <html>; the media query is only the default
     until that lands. Same recipe as doc.css. */
  :root {
    --bg: #f4f4f6; --panel: #ffffff; --line: #dcdce2;
    --fg: #33343c; --dim: #8b8d99; --accent: #4a6bdf; --accent2: #3a55b8;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-appearance]) {
      --bg: #26272e; --panel: #1e1f26; --line: #3a3b45;
      --fg: #d6d8e0; --dim: #83859a; --accent: #7d96ec; --accent2: #93a8f0;
      color-scheme: dark;
    }
  }
  :root[data-appearance="dark"] {
    --bg: #26272e; --panel: #1e1f26; --line: #3a3b45;
    --fg: #d6d8e0; --dim: #83859a; --accent: #7d96ec; --accent2: #93a8f0;
    color-scheme: dark;
  }

  html, body { height: 100%; overflow: hidden; }
  body {
    display: flex; flex-direction: column;
    background: var(--bg); color: var(--fg);
    font: 13px -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  body.dropping { outline: 3px solid var(--accent); outline-offset: -3px; }

  /* The one-time Introduction banner. Dismissing it swaps in a line saying
     where the window lives, then the whole bar fades out — and never returns. */
  #introBar {
    flex: none; display: flex; align-items: center; gap: 10px;
    padding: 8px 14px; font-size: 12px;
    background: color-mix(in srgb, var(--accent) 12%, var(--bg));
    border-bottom: 1px solid color-mix(in srgb, var(--accent) 30%, var(--line));
    transition: opacity .6s;
  }
  #introBar .flex { flex: 1; }
  #introBar b { font-weight: 600; }
  #introBar button {
    font: 11.5px -apple-system, sans-serif; border-radius: 6px; padding: 4px 12px;
    background: var(--accent); border: none; color: #fff;
  }
  #introBar #introX {
    background: none; color: var(--dim); font-size: 12px; padding: 4px 6px;
  }
  #introBar #introX:hover { color: var(--fg); }
  #introBar.bye { justify-content: center; color: var(--dim); }

  #hero { text-align: center; padding: 26px 20px 18px; flex: none; }
  #hero svg { width: 44px; height: 44px; }
  #hero h1 { font-size: 21px; font-weight: 650; margin-top: 6px; }
  #hero p { font-size: 12px; color: var(--dim); margin-top: 3px; }

  /* The window resizes now, so both rows have to survive a narrow one (the
     buttons wrap) and a wide one (the lists stop short of a silly line). */
  #actions {
    display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;
    padding: 0 16px 16px; flex: none;
  }
  #actions button {
    font: 12.5px -apple-system, sans-serif; font-weight: 500;
    border: 1px solid var(--line); border-radius: 8px;
    background: var(--panel); color: var(--fg);
    padding: 7px 16px;
  }
  #actions button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  #actions button span { opacity: .55; font-weight: 400; margin-left: 6px; font-size: 11px; }

  #draftCard {
    /* same column as the lists below it, whatever the window's width */
    width: calc(100% - 36px); max-width: 684px; margin: 0 auto 12px;
    padding: 10px 14px; flex: none;
    display: flex; align-items: center; gap: 10px;
    background: var(--panel); border: 1px solid var(--accent); border-radius: 10px;
    font-size: 12px;
  }
  #draftCard b { font-weight: 600; }
  #draftCard .flex { flex: 1; }
  #draftCard button {
    font: 11.5px -apple-system, sans-serif; color: #fff;
    background: var(--accent); border: none; border-radius: 6px; padding: 4px 12px;
  }

  #recents { flex: 1; overflow-y: auto; padding: 0 18px 16px; width: 100%; max-width: 720px; margin: 0 auto; }
  #recents h2 {
    font-size: 11px; font-weight: 600; color: var(--dim);
    text-transform: uppercase; letter-spacing: .05em; margin: 4px 2px 8px;
  }
  .recent {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: 8px; cursor: default;
  }
  .recent:hover { background: var(--panel); }
  .recent .icon { font-size: 17px; }
  .recent .names { flex: 1; min-width: 0; }
  .recent .name { font-size: 12.5px; font-weight: 500; }
  .recent .dir {
    font-size: 11px; color: var(--dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .recent .x { color: var(--dim); font-size: 12px; padding: 4px 6px; visibility: hidden; }
  .recent:hover .x { visibility: visible; }
  .recent.gone { opacity: .45; }
  .recent.gone .name::after { content: "  (moved or deleted)"; font-weight: 400; color: var(--dim); }
  /* the folder that is open right now, so reopening it isn't a mystery */
  .recent .open {
    font-size: 10px; font-weight: 600; color: #fff; background: var(--accent);
    border-radius: 5px; padding: 2px 6px; text-transform: uppercase; letter-spacing: .04em;
  }
  #recents h2 + .recent { margin-top: -2px; }
  #recents .gap { height: 14px; }

  #empty { text-align: center; color: var(--dim); font-size: 12px; padding: 26px 0; }

  #cliLine { flex: none; text-align: center; padding: 6px 0 12px; font-size: 11px; }
  #cliLine a { color: var(--dim); cursor: default; }
  #cliLine a:hover { color: var(--accent); text-decoration: underline; }
</style>
<script>
  // no browser right-click menu in tinyjs apps — text fields keep theirs
  addEventListener('contextmenu', (e) => {
    if (!e.target.closest('input, textarea, [contenteditable]')) e.preventDefault();
  });
</script>
</head>
<body>

<div id="introBar" hidden>
  <span class="flex">New here? The <b>Introduction to Nib</b> says what it’s for —
  documentation folders, linking, pinning, the editable preview.</span>
  <button id="introOpen">Read it</button>
  <button id="introX" title="Dismiss — it stays in the Help menu">✕</button>
</div>

<div id="hero">
  <svg viewBox="0 0 48 48" fill="none">
    <path d="M24 45 C17 36 10 27.5 10 18.5 A14 13.5 0 0 1 38 18.5 C38 27.5 31 36 24 45 Z"
          fill="var(--accent)" opacity=".92"/>
    <path d="M24 41 L24 25" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="24" cy="20.5" r="2.6" fill="#fff"/>
  </svg>
  <h1>Nib</h1>
  <p>A tiny Markdown editor — drop a .md file anywhere in this window</p>
</div>

<div id="actions">
  <button id="btnNew" class="primary">New Document<span>⌘N</span></button>
  <button id="btnOpen">Open…<span>⌘O</span></button>
  <button id="btnFolder" title="Open a folder as a project — its files appear in every document window">Open Folder…<span>⌘⇧F</span></button>
  <button id="btnExample" title="A document showing everything Nib renders">Example</button>
</div>

<div id="draftCard" hidden>
  <span>📝</span>
  <span><b>Unsaved draft</b> from a closed untitled window</span>
  <span class="flex"></span>
  <button id="btnDraft">Restore</button>
</div>

<div id="recents"></div>

<!-- Windows and Linux run without a menu bar, so the terminal command needs a
     door somewhere visible; on macOS it doubles the File menu item. -->
<div id="cliLine"><a id="btnCli">Install the nib terminal command…</a></div>

<script src="zoom.js"></script>
<script src="updates.js"></script>
<script>
(async () => {
  const $ = (id) => document.getElementById(id);

  let appearance = 'system';
  async function applyAppearance(a) {
    appearance = a || 'system';
    let dark = appearance === 'dark';
    if (appearance === 'system') {
      const t = await tiny.theme.get();
      dark = !!(t && t.dark);
    }
    document.documentElement.dataset.appearance = dark ? 'dark' : 'light';
  }
  tiny.theme.on(() => { if (appearance === 'system') applyAppearance('system'); });
  tiny.api.on('appearance', ({ appearance: a }) => applyAppearance(a));

  function paint(p) {
    if (p.appearance) applyAppearance(p.appearance);
    $('draftCard').hidden = !p.untitledDraft;

    const box = $('recents');
    box.textContent = '';
    const folders = p.folders || [];
    if (!p.recents.length && !folders.length) {
      box.insertAdjacentHTML('beforeend',
        '<div id="empty">Files and folders you open will show up here.</div>');
      return;
    }

    // One row shape for both lists — a folder just opens a whole tree instead
    // of a single document, and says so with its icon.
    const heading = (text) => {
      const h = document.createElement('h2');
      h.textContent = text;
      box.appendChild(h);
    };
    const rowFor = (r, { folder }) => {
      const row = document.createElement('div');
      row.className = 'recent' + (r.exists ? '' : ' gone');
      const slash = r.path.lastIndexOf('/');

      const icon = document.createElement('span');
      icon.className = 'icon';
      icon.textContent = folder ? '🗂' : '📄';
      const names = document.createElement('div');
      names.className = 'names';
      const name = document.createElement('div');
      name.className = 'name';
      name.textContent = r.path.slice(slash + 1);
      const dir = document.createElement('div');
      dir.className = 'dir';
      // A long path is identified by its END, so trim from the left: the last
      // few folders tell you which "docs" this is, the first few never do.
      const full = r.path.slice(0, slash).replace(/^\/Users\/[^/]+/, '~');
      const parts = full.split('/');
      let tail = parts[parts.length - 1];
      for (let i = parts.length - 2; i >= 0 && (parts[i] + '/' + tail).length <= 48; i--) {
        tail = parts[i] + '/' + tail;
      }
      dir.textContent = tail === full ? full : '…/' + tail;
      dir.title = r.path;
      names.append(name, dir);
      row.append(icon, names);

      if (folder && r.open) {
        const badge = document.createElement('span');
        badge.className = 'open';
        badge.textContent = 'open';
        row.appendChild(badge);
      }
      const x = document.createElement('span');
      x.className = 'x';
      x.textContent = '✕';
      x.title = 'Remove from list';
      const forget = folder ? 'removeRecentFolder' : 'removeRecent';
      x.onclick = (e) => {
        e.stopPropagation();
        tiny.api.call(forget, { path: r.path });
      };
      row.appendChild(x);
      row.onclick = () => {
        if (!r.exists) { tiny.api.call(forget, { path: r.path }); return; }
        if (folder) tiny.api.call('openFolder', { path: r.path });
        else tiny.api.call('openPaths', { paths: [r.path] });
      };
      box.appendChild(row);
    };

    if (folders.length) {
      heading('Recent folders');
      for (const r of folders) rowFor(r, { folder: true });
      if (p.recents.length) box.insertAdjacentHTML('beforeend', '<div class="gap"></div>');
    }
    if (p.recents.length) {
      heading(folders.length ? 'Recent files' : 'Recent');
      for (const r of p.recents) rowFor(r, { folder: false });
    }
  }

  $('btnNew').onclick = () => tiny.api.call('newDoc');
  $('btnOpen').onclick = async () => {
    // what Nib can open: the backend's OPENABLE + IMAGES sets
    const picks = await tiny.dialog.openFiles({ types: [
      'md', 'markdown', 'mdown', 'mkdn', 'mkd', 'mdwn', 'mdtxt', 'mdtext',
      'mdx', 'qmd', 'rmd', 'mdc', 'adoc', 'asciidoc', 'txt',
      'png', 'jpg', 'jpeg', 'gif', 'webp', 'svg', 'avif', 'heic', 'tiff',
    ] });
    if (picks) tiny.api.call('openPaths', { paths: picks });
  };
  // A folder becomes the project behind every document window: file tree,
  // Open Quickly, and its own .nib/settings.json.
  async function openFolder() {
    const dir = await tiny.dialog.pickFolder();
    if (dir) tiny.api.call('openFolder', { path: dir });
  }
  $('btnFolder').onclick = openFolder;
  $('btnDraft').onclick = () => tiny.api.call('restoreUntitled');
  $('btnExample').onclick = () => tiny.api.call('openExample');
  $('btnCli').onclick = () => installCliUI();

  // The Introduction banner, first launches only. Reading it or closing it
  // both retire it for good — the goodbye line says where it lives on
  // (Help ▸ Introduction to Nib), then the bar fades out.
  function retireIntro(open) {
    tiny.api.call('dismissIntro');
    if (open) tiny.api.call('openHelp');
    const bar = $('introBar');
    bar.classList.add('bye');
    bar.textContent = 'It stays in Help ▸ Introduction to Nib — ⌘⇧H whenever you want it.';
    setTimeout(() => { bar.style.opacity = '0'; }, open ? 2500 : 6000);
    setTimeout(() => { bar.hidden = true; }, open ? 3200 : 6700);
  }
  $('introOpen').onclick = () => retireIntro(true);
  $('introX').onclick = () => retireIntro(false);

  // menus broadcast to every window; act only when we're the key window
  tiny.menu.on(async (id) => {
    if (!document.hasFocus()) return;
    if (id === 'new') tiny.api.call('newDoc');
    else if (id === 'open') $('btnOpen').onclick();
    else if (id === 'openfolder') openFolder();
    // 'closefolder' and 'newwindow' are the backend's — they need no page state
    else if (id === 'check-updates') checkForUpdatesUI();
    else if (id === 'default-md') makeDefaultUI();
    else if (id === 'install-cli') installCliUI();
  });

  // .md files land here from Finder too (Dock icon, double-click)
  tiny.win.onDrop((paths) => tiny.api.call('openPaths', { paths }));
  tiny.app.onOpenFiles(() => {});      // backend's onOpenFiles does the work

  document.addEventListener('dragover', () => document.body.classList.add('dropping'));
  document.addEventListener('dragleave', () => document.body.classList.remove('dropping'));
  document.addEventListener('drop', () => document.body.classList.remove('dropping'));

  // Whatever size you leave this window at is the size it comes back at —
  // a long list of folders is worth making room for once, not every launch.
  let sizeTimer = null;
  addEventListener('resize', () => {
    clearTimeout(sizeTimer);
    sizeTimer = setTimeout(() => tiny.api.call('rememberWelcomeSize', {
      width: innerWidth, height: innerHeight,
    }), 400);
  });

  tiny.api.on('welcome', paint);
  const boot = await tiny.api.call('boot');
  setupZoom(boot.zoom);
  $('introBar').hidden = !!boot.introSeen;
  paint(boot);
})();
</script>
</body>
</html>
