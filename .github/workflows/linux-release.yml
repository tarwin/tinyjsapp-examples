# Linux fleet release — MANUAL ONLY (workflow_dispatch; never wire this to
# push/tag triggers: a Linux release is an explicit decision, and half the
# fleet at once is a lot of releases to un-ship).
#
# What it does, mirroring the runbook in CLAUDE.md ("Linux (containerized)"):
#   1. Builds the chosen apps INSIDE ubuntu:22.04 containers on both arches,
#      via shelf/pkg-linux-container.sh — the same script the Linux VM flow
#      uses, unchanged, so there is exactly one build path. The container (not
#      the runner image) sets the glibc floor, and the script floor-checks the
#      binaries inside every finished tarball (≤ 2.35, loads on Ubuntu 22.04 /
#      Debian 12).
#   2. Uploads tarballs to the per-app GitHub releases (tag <dir>-v<version>)
#      via shelf/upload-releases-linux.sh.
#   3. Merges the linux blocks into the committed manifests (both arch passes
#      of shelf/merge-manifest-linux.js --release), regenerates the catalog
#      (shelf/gen-catalog-linux.js --release), bumps README's Linux download
#      links (shelf/readme-linux-links.js), and pushes — all re-applied on a
#      fresh main and retried if the push races another release, so a
#      concurrent mac/win edit is never clobbered or conflicted with.
#
# NOT done here: ../tinyjsapp docs/index.html's Linux links (other repo — do
# that by hand or ask the agent), and per-app version bumps in tinyjs.json
# (bump + commit BEFORE dispatching; the build packages what is committed).
#
# Runner labels are plain ubuntu-latest/ubuntu-24.04-arm ON PURPOSE: the
# build runs in the 22.04 container, so the runner's own userspace never
# touches the shipped binaries — only docker needs to work.

name: linux-release

on:
  workflow_dispatch:
    inputs:
      tinyjs_tag:
        description: "tinyjs release tag to build against (e.g. v0.34.0)"
        required: true
        type: string
      apps:
        description: "space-separated app dirs; empty = all except amp (name amp explicitly to include it)"
        required: false
        default: ""
        type: string

concurrency:
  group: linux-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Build fleet in ubuntu:22.04 container
        env:
          TINYJS_TAG: ${{ inputs.tinyjs_tag }}
          APPS: ${{ inputs.apps }}
        run: |
          mkdir -p "$RUNNER_TEMP/fleet"
          docker run --rm \
            -v "$PWD/shelf/pkg-linux-container.sh:/pkg.sh:ro" \
            -v "$RUNNER_TEMP/fleet:/work" \
            -v "$PWD:/examples:ro" \
            -e TINYJS_TAG -e APPS \
            ubuntu:22.04 bash /pkg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/fleet/out/
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: linux-x86_64
          path: out-x86_64
      - uses: actions/download-artifact@v4
        with:
          name: linux-arm64
          path: out-arm64

      # Stage the way the runbook stages: both arches' tarballs into
      # _builds/<dir>/ (gitignored payload; only manifest.json commits), and
      # the x86_64 tarball + its manifest (renamed manifest.json) into
      # <app>/dist/publish/ where upload-releases / merge-manifest read them.
      - name: Stage tarballs
        run: |
          set -euo pipefail
          for d in out-x86_64/*/; do
            app=$(basename "$d")
            mkdir -p "_builds/$app" "$app/dist/publish"
            rm -f "$app"/dist/publish/*-linux-*.tar.gz
            cp out-x86_64/"$app"/*.tar.gz "_builds/$app/"
            cp out-arm64/"$app"/*.tar.gz "_builds/$app/"
            cp out-x86_64/"$app"/*.tar.gz "$app/dist/publish/"
            cp out-x86_64/"$app"/manifest-x86_64.json "$app/dist/publish/manifest.json"
            echo "staged: $app"
          done

      - name: Upload to GitHub releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash shelf/upload-releases-linux.sh

      # Everything derived from the build — manifests (both arch passes), the
      # catalog, README's Linux links — is applied on top of the LATEST main,
      # then committed and pushed. If another release (windows-release, a
      # mac release from a laptop) pushes first, the push is rejected and the
      # whole step reruns on the new main instead of rebasing: both sides
      # rewrite the same README download line, so a rebase conflicts, while
      # re-applying is always clean. Every tool here is idempotent and reads
      # only staged files (_builds/, <app>/dist/publish/, out-*/), which
      # `git reset --hard` leaves alone.
      - name: Merge, commit and push (on a fresh main, retried)
        env:
          TINYJS_TAG: ${{ inputs.tinyjs_tag }}
          APPS: ${{ inputs.apps }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          apply() {
            for d in out-x86_64/*/; do
              app=$(basename "$d")
              cp out-x86_64/"$app"/manifest-x86_64.json "$app/dist/publish/manifest.json"
            done
            node shelf/merge-manifest-linux.js --release
            for d in out-arm64/*/; do
              app=$(basename "$d")
              cp out-arm64/"$app"/manifest-arm64.json "$app/dist/publish/manifest.json"
            done
            node shelf/merge-manifest-linux.js --release
            node shelf/gen-catalog-linux.js --release
            node shelf/readme-linux-links.js out-x86_64
          }
          for try in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard FETCH_HEAD
            apply
            git add _builds/*/manifest.json catalog.json shelf/src/frontend/catalog.js README.md
            if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
            git commit -q -m "linux release: ${APPS:-fleet} (tinyjs $TINYJS_TAG) [via linux-release workflow]"
            if git push origin HEAD:main; then exit 0; fi
            echo "push raced another release (try $try) — re-applying on the new main"
            sleep $((try * 5))
          done
          echo "gave up after 5 tries"; exit 1
