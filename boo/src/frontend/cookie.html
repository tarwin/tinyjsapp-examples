<!doctype html>
<!-- The treat itself: a tiny transparent, always-on-top, click-through window
     the backend parks on the cursor while boo is being tempted. The grab is
     instant (the backend just hides this window); the only animation left is
     the fling, when a shaken cursor sends it spinning. -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  #c {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
  }
  #c.flung {
    transition: transform .32s ease-out, opacity .32s;
    transform: translate(46px, -60px) rotate(200deg) scale(.7);
    opacity: 0;
  }
</style>
</head>
<body>
<div id="c">🍪</div>
<script>
  const c = document.getElementById('c');
  const fresh = () => { c.className = ''; };
  tiny.api.on('cookie-fresh', fresh);
  tiny.api.on('pet', (p) => { if (p.cookie) fresh(); });
  tiny.api.on('cookie-drop', () => { c.className = 'flung'; });
</script>
</body>
</html>
