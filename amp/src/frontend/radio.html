<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>amp — radio</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="chassis">
  <div class="titlebar">
    <span class="tt">Radio</span>
    <span class="shade-only" id="raShade">no station</span>
    <button class="wbtn" id="close" title="Close">×</button>
  </div>

  <div class="radio-body">
    <div class="r-head">
      <button class="btn sm" id="tabWorld" title="The globe — real stations near real cities">WORLD</button>
      <button class="btn sm" id="tabFavs" title="Your starred stations — ★ any row to add">FAVS</button>
      <button class="btn sm" id="tabList" title="A directory of ~400 hand-picked streams (CC0, deroverda/recommended-radio-streams)">LIST</button>
      <button class="btn sm" id="tabPicks" title="A starter dial — Tarwin's picks">PICKS</button>
      <span class="rled" id="tLed"></span>
      <span class="seg r-city" id="tCity">—</span>
      <!-- off the globe the city stop is noise: this stretch shows what's ON -->
      <span class="seg r-city" id="tNow" style="display:none"><span id="tNowNm">—</span></span>
      <span class="r-sp"></span>
      <button class="btn sm" id="tOff" title="Radio off — back to the playlist">OFF</button>
    </div>
    <div class="r-row">
      <canvas id="globe" width="240" height="240" title="Drag to spin · click a city"></canvas>
      <div class="r-split" id="rSplit" title="Drag to resize the globe · double-click resets"></div>
      <ul class="r-list" id="stations"><li class="empty">finding you on the globe…</li></ul>
    </div>
    <!-- LIST + PICKS: a flat dial instead of the globe. The filter box only
         matters for LIST's four hundred entries but costs nothing on PICKS. -->
    <div class="r-alt" id="rAlt" style="display:none">
      <input id="rFilter" type="text" placeholder="filter — name, genre, description… (try: flac)" spellcheck="false" style="display:none">
      <ul class="r-list" id="rAltList"></ul>
    </div>
  </div>
</div>
<script src="drag.js"></script>
<script src="world-outline.js"></script>
<script src="radio-list.js"></script>
<script src="radio-picks.js"></script>
<script src="tuner.js"></script>
<script src="radio.js"></script>
</body>
</html>
